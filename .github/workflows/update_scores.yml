name: Update Baseball Scores

on:
  schedule:
    # 毎日 22:00 JST（13:00 UTC）に実行
    - cron: '0 13 * * *'
  workflow_dispatch: # 手動実行ボタンも追加

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v3

      - name: Python環境のセットアップ
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 必要なライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: スクレイピングの実行
        run: python get_scores.py

      - name: 変更をGitHubにコミット＆プッシュ
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add game_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update game_data.json" && git push)
